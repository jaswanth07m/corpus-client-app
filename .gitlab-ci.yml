# GitLab CI/CD configuration for corpus-frontend
# This pipeline includes format checks, linting, TypeScript checking, and building for the React/Vite project

stages:
  - build

# Combined job that runs format check, lint check, TypeScript check, and build
build-job:
  stage: build
  image: node:18-alpine
  cache:
    paths:
      - node_modules/
  before_script:
    - npm ci
  script:
    - echo "Checking code formatting with Prettier..."
    - npm run format:check
    - echo "Code formatting check completed successfully."
    - echo ""
    - echo "Running ESLint checks..."
    - npm run lint
    - echo "Linting completed successfully."
    - echo ""
    - echo "Running TypeScript type checks..."
    - npx tsc --noEmit
    - echo "TypeScript type checks completed successfully."
    - echo ""
    - echo "Building the React application..."
    - npm run build
    - echo "Build completed successfully."
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
