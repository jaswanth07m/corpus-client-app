# GitLab CI/CD configuration for corpus-frontend
# Optimized pipeline with lockfile-based npm caching

stages:
  - test
  - build
  - build-apk

test:
  stage: test
  image: node:latest
  before_script:
    - apt-get update && apt-get install -y git
    - npm install
  script:
    - npm run test:coverage
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 1 week
  coverage: '/All files[^|]*\|[^|]*\s+([\d.]+)%/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-job:
  stage: build
  image: node:22-alpine
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - echo "Checking code formatting with Prettier..."
    - npm run format:check
    - echo "Code formatting check completed successfully."
    - echo ""
    - echo "Running ESLint checks..."
    - npm run lint
    - echo "Linting completed successfully."
    - echo ""
    - echo "Running TypeScript type checks..."
    - npx tsc --noEmit
    - echo "TypeScript type checks completed successfully."
    - echo ""
    - echo "Building the React application..."
    - npm run build
    - echo "Build completed successfully."
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

build-apk:
  stage: build-apk
  image: node:22-alpine
  needs: []
  before_script:
    # Install Java and essential tools
    - apk add --no-cache openjdk21 curl unzip git bash
    - mkdir -p /opt/android-sdk
    - export ANDROID_SDK_ROOT=/opt/android-sdk
    - export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
    - export GRADLE_OPTS="-Xmx4096m -XX:+UseG1GC"
    - |
      if [ ! -d "$ANDROID_SDK_ROOT/cmdline-tools/latest" ]; then
        echo "Downloading Android SDK cmdline-tools..."
        curl -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
        unzip -q /tmp/cmdline-tools.zip -d /tmp/
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        mv /tmp/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
        rm /tmp/cmdline-tools.zip
      fi
    # Accept SDK licenses
    - yes | sdkmanager --licenses > /dev/null 2>&1 || true
    # Install required SDK components
    - sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" > /dev/null 2>&1
    - npm ci
  script:
    - echo "Building React application..."
    - npm run build
    - echo ""
    - echo "Syncing Capacitor..."
    - npx cap sync
    - echo ""
    - echo "Building debug APK..."
    - export GRADLE_OPTS="-Xmx4096m -XX:+UseG1GC"
    - cd android && ./gradlew assembleDebug && cd ..
    - echo "APK build completed successfully."
  artifacts:
    paths:
      - android/app/build/outputs/apk/debug/
    expire_in: 1 week
