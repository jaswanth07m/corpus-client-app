# GitLab CI/CD configuration for corpus-frontend
# This pipeline includes format checks, linting, and building for the React/Vite project

stages:
  - format
  - lint
  - build

# Format check job - ensures code is properly formatted
format-check-job:
  stage: format
  image: node:18-alpine
  cache:
    paths:
      - node_modules/
  before_script:
    - npm ci
  script:
    - echo "Checking code formatting with Prettier..."
    - npm run format:check
    - echo "Code formatting check completed successfully."

# Lint check job - ensures code follows linting rules
lint-check-job:
  stage: lint
  image: node:18-alpine
  cache:
    paths:
      - node_modules/
  before_script:
    - npm ci
  script:
    - echo "Running ESLint checks..."
    - npm run lint
    - echo "Linting completed successfully."

# Build job - builds the React application
build-job:
  stage: build
  image: node:18-alpine
  cache:
    paths:
      - node_modules/
  before_script:
    - npm ci
  script:
    - echo "Building the React application..."
    - npm run build
    - echo "Build completed successfully."
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
